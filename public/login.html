<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0a">
<title>Sign in · Lumen</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<main class="center">
  <form class="auth" id="f" autocomplete="on">
    <p class="brandline"><a class="brand" href="/">Lum<b>e</b>n</a></p>
    <h1>Owner sign in</h1>
    <label class="field"><span>Password</span>
      <input type="password" id="pw" name="password" autocomplete="current-password" required autofocus>
    </label>
    <p class="msg" id="msg" role="alert"></p>
    <button class="btn full" id="go">Sign in</button>
  </form>
</main>
<script src="/assets/login.js"></script>
</body>
</html>
